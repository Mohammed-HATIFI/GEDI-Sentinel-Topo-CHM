[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gedi-sentinel-chm"
version = "0.1.0"
description = "Reproducibility code for GEDI-Sentinel canopy-height mapping in Morocco"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [{name = "Mohammed Hatifi"}]
dependencies = ["numpy>=1.26,<2", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gedi_sentinel_chm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
